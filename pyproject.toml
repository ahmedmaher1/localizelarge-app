[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localizelarge"
version = "1.0.0"
description = "Localize Large: a Windows desktop CAT tool for in-house localization teams, with built-in quality checks."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Localize Large", email = "contact@localizelarge.com"},
]
keywords = ["translation", "CAT", "localization", "translation-memory", "glossary", "MQM", "quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: Linguistic",
    "Environment :: X11 Applications :: Qt",
]

# Keep this list the same as requirements.txt.
dependencies = [
    "PyQt6>=6.5.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "lxml>=4.9.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "google-generativeai>=0.3.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "markitdown>=0.0.1",
    "pyperclip>=1.8.2",
    "pyspellchecker>=0.7.0",
    "spylls>=0.1.7",
    "psutil>=5.9.0",
    "rapidfuzz>=3.0.0",
    "jsonschema>=4.0.0",
    "keyring>=25.0; platform_system != 'Windows'",
]

[project.urls]
Homepage = "https://localizelarge.com"

[tool.setuptools]
py-modules = ["Supervertaler"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "localizelarge*"]
