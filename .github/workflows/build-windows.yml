name: Build Windows ZIP

# Started by hand. Builds the ZIP and keeps it as a private workflow artifact.
# It does not publish anything. With "stage" ticked it also pushes the ZIP, cut into parts
# under GitHub's 100 MB file limit, to the branch build-artifact of this (private)
# repository, from where it can be fetched with git and uploaded to the website's hosting.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label added to the file name (empty for a release build)"
        required: false
        default: "preview"
      stage:
        description: "Also put the ZIP on the branch build-artifact, in parts (for uploading to the website)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # only used by the optional "stage" step, which pushes the branch build-artifact

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Python packages
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        env:
          BUILD_LABEL: ${{ inputs.label }}
        run: ./scripts/build_release.ps1 -Label $env:BUILD_LABEL

      - name: Show what was built
        if: always()
        shell: pwsh
        run: |
          if (Test-Path release) { Get-ChildItem release | Format-Table Name, Length }
          if (Test-Path release/release.json) { Get-Content release/release.json }
          if (Test-Path dist/LocalizeLarge) {
            "Largest folders in the build:"
            Get-ChildItem dist/LocalizeLarge/_internal -Directory | ForEach-Object {
              [pscustomobject]@{ MB = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1); Name = $_.Name }
            } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LocalizeLarge-windows-build
          path: release/
          retention-days: 14
          if-no-files-found: error

      - name: Stage the ZIP on the branch build-artifact
        if: ${{ inputs.stage }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/stage"
          mkdir -p "$work"
          cp release/*.sha256 release/release.json "$work/"
          zip=$(ls release/*.zip)
          split -b 90m -d "$zip" "$work/$(basename "$zip").part"
          cd "$work"
          git init -q -b build-artifact
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Build artifact of ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" build-artifact
          ls -la
